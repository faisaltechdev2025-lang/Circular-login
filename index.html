 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Login</title>
  <link rel="preconnect" href="https://fonts.google.com/">
  <link rel="preconnect" href="https://fonts.google.com/" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <style>
    body {
      font-family: "Poppins" sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d0d;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .circle-container {
      position: relative;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(20,20,20,0.8);
      box-shadow: 0 0 40px rgba(0,255,255,0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      backdrop-filter: blur(6px);
    
      
    }

    .circle-container h2 {
      color: #00ffe0;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .circle-container input {
      width: 70%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 30px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      transition: 0.3s;
      
    }

    .circle-container input:hover {
      background: rgba(0,255,200,0.2);
      box-shadow: 0 0 15px #00ffe0;
    }

    .circle-container button {
      width: 50%;
      padding: 10px; 
      margin-top: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg,#00e6e6,#ff00ff);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #00ffe0;
    }

    .circle-container button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px #ff00ff;
    }

    /* الحلقة الخارجية */
    .ring {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        #FC6107 0deg 5deg,
        transparent 5deg 10deg
      );
      animation: spin 10s linear infinite, glow 3s ease-in-out infinite;
      filter: blur(1px);
      z-index: 1;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px #00ffe0; opacity: 0.7; }
      50% { box-shadow: 0 0 60px #ff00ff; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="circle-container">
    <h2>Login</h2>
    <input type="text" placeholder="Username" required>
    <input type="password" placeholder="Password"  minlength="1" maxlength="9">
    <button onclick="login()">Login</button>
  </div>
</body>
</html>
